  <script>
    function increment(id) {
      const el = document.getElementById(id);
      let val = parseInt(el.innerText);
      el.innerText = val + 1;
      animatePress(el);
    }

    function decrement(id) {
      const el = document.getElementById(id);
      let val = parseInt(el.innerText);
      if (val > 0) {
        el.innerText = val - 1;
        animatePress(el);
      }
    }

    function animatePress(el) {
      el.classList.add('scale-125', 'text-stadium-green-light');
      setTimeout(() => {
        el.classList.remove('scale-125', 'text-stadium-green-light');
      }, 150);
    }

    document.getElementById('save-btn').addEventListener('click', function () {
      const btn = this;
      const originalContent = btn.innerHTML;

      btn.innerHTML = `
                <span class="material-symbols-outlined animate-spin">sync</span>
                <span class="font-label-bold text-label-bold">Saving...</span>
            `;
      btn.classList.add('opacity-80');

      setTimeout(() => {
        btn.innerHTML = `
                    <span class="material-symbols-outlined">check_circle</span>
                    <span class="font-label-bold text-label-bold">Saved!</span>
                `;
        btn.classList.remove('bg-stadium-green-light');
        btn.classList.add('bg-action-blue');

        setTimeout(() => {
          btn.innerHTML = originalContent;
          btn.classList.remove('bg-action-blue', 'opacity-80');
          btn.classList.add('bg-stadium-green-light');
        }, 2000);
      }, 1200);
    });

    // Simple scroll observer for FAB hide/show
    let lastScrollY = window.scrollY;
    window.addEventListener('scroll', () => {
      const fab = document.getElementById('save-btn');
      if (window.scrollY > lastScrollY) {
        fab.classList.add('translate-y-24', 'opacity-0');
      } else {
        fab.classList.remove('translate-y-24', 'opacity-0');
      }
      lastScrollY = window.scrollY;
    });
  </script>
</body>

</html>
