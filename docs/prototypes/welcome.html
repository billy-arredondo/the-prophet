  <style>
    body {
      background-color: #f8f9fa;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }

    .floating-ball {
      animation: float 6s ease-in-out infinite;
    }

    @keyframes float {
      0% {
        transform: translateY(0px) rotate(0deg);
      }

      50% {
        transform: translateY(-20px) rotate(5deg);
      }

      100% {
        transform: translateY(0px) rotate(0deg);
      }
    }

    .confetti-slow {
      animation: confetti 10s linear infinite;
    }

    @keyframes confetti {
      0% {
        transform: translateY(-10vh) rotate(0deg);
        opacity: 1;
      }

      100% {
        transform: translateY(110vh) rotate(360deg);
        opacity: 0;
      }
    }

    .stadium-curve {
      border-radius: 50% 50% 0 0 / 20% 20% 0 0;
    }

    .button-press {
      transition: transform 0.1s ease-out;
    }

    .button-press:active {
      transform: scale(0.96);
    }
  </style>
  <style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="flex flex-col min-h-screen text-on-background">
  <!-- Subtle Background Decoration -->
  <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
    <div class="absolute top-10 left-10 w-4 h-4 bg-stadium-green-light rounded-full opacity-20 confetti-slow"
      style="animation-delay: 0s"></div>
    <div class="absolute top-20 right-20 w-3 h-3 bg-secondary-container rounded-full opacity-20 confetti-slow"
      style="animation-delay: 2s"></div>
    <div class="absolute top-40 left-1/4 w-5 h-5 bg-tertiary-container rounded-full opacity-10 confetti-slow"
      style="animation-delay: 5s"></div>
    <div class="absolute top-60 right-1/3 w-4 h-4 bg-action-blue rounded-full opacity-20 confetti-slow"
      style="animation-delay: 1s"></div>
  </div>
  <!-- Main Content Canvas -->
  <main
    class="flex-grow flex flex-col items-center justify-center relative z-10 px-margin-mobile md:px-margin-desktop py-lg max-w-lg mx-auto w-full">
    <!-- Branding Top Bar (Hidden in shell logic but visible for identity) -->
    <div class="flex items-center gap-xs mb-xl">
      <span class="material-symbols-outlined text-stadium-green-light" style="font-size: 32px;">sports_soccer</span>
      <span class="font-display-score text-headline-md text-stadium-green-dark">Mundialito</span>
    </div>
    <!-- Hero Section -->
    <div class="w-full flex flex-col items-center mb-xl">
      <div class="relative w-64 h-64 md:w-80 md:h-80 mb-lg">
        <!-- Decorative Glow -->
        <div class="absolute inset-0 bg-stadium-green-light opacity-10 blur-3xl rounded-full"></div>
        <!-- Main Illustration -->
        <div class="relative z-10 w-full h-full flex items-center justify-center">
          <div class="floating-ball relative">
            <img class="w-56 h-56 md:w-72 md:h-72 object-cover rounded-full shadow-2xl border-4 border-jersey-white"
              data-alt="A stylized, vibrant 3D soccer ball floating in mid-air against a bright stadium atmosphere. The scene is filled with colorful flags from various nations like Brazil, Mexico, and USA waving in the background. The lighting is sunny and warm, creating a festive World Cup 2026 festival mood. The overall aesthetic is modern, tactile, and family-friendly with bright greens and trophy golds."
              src="https://lh3.googleusercontent.com/aida-public/AB6AXuDHh5byNIk0VQnNwwadIEYHASsyCMuWVAZy3ySb-P1rw9aPZ3WQWd1aCv8EMFkVikWt70azwGlAzosuTcOZqNGt8RDSVJuffflhHHSR7Uwuii3viEsMGJ0CN-R-N6fPiT9qUOIw4YDaV3AQtJI4wi-MSaMSyL9xUpKcowpu9eeZ1yhW7TcdYfw1f-UZwpPxHuWTHsgSTfM16kbZ-TLe8wxXTBu8FiQKCarDCG-Xf-W2yqAubtYSAQXJNB4_WZ_uM2cYu_yJRlKsbac" />
            <!-- Icon Overlay Badges -->
            <div
              class="absolute -top-4 -right-4 bg-secondary-container p-3 rounded-full shadow-lg border-2 border-jersey-white">
              <span class="material-symbols-outlined text-on-secondary-container"
                style="font-variation-settings: 'FILL' 1;">emoji_events</span>
            </div>
            <div
              class="absolute -bottom-2 -left-2 bg-action-blue p-3 rounded-full shadow-lg border-2 border-jersey-white">
              <span class="material-symbols-outlined text-white" style="font-variation-settings: 'FILL' 1;">group</span>
            </div>
          </div>
        </div>
      </div>
      <!-- Headlines -->

        <h1

          Mundialito 2026
        </h1>
        <p class="font-body-lg text-body-lg text-on-surface-variant max-w-xs mx-auto">
          Predice, Compite, Gana en Familia
        </p>

    </div>
    <!-- Action Card -->

        <div class="flex-grow border-t border-outline-variant"></div>

        Al continuar, aceptas nuestros
        <a class="text-stadium-green-light font-medium" href="#">Términos de Servicio</a>
        y
        <a class="text-stadium-green-light font-medium" href="#">Política de Privacidad</a>.
